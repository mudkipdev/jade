[project]
name = "jade"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
jade = "jade.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]